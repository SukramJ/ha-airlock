name: Dependabot auto-merge

# Queues Dependabot's minor and patch PRs for auto-merge. Nothing merges
# until branch protection is satisfied, so the required ci checks still
# decide — this only removes the click.
#
# Major bumps are excluded on purpose: a dependency that relicenses or
# changes its surface arrives as a version number like any other, and in a
# project whose dependency set is a security property a major bump is a
# decision a person makes.

on: pull_request_target

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3
      - name: Enable auto-merge for non-major updates
        if: steps.meta.outputs.update-type != 'version-update:semver-major'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
