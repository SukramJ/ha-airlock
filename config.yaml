# Home Assistant App configuration, read by the Supervisor.
#
# The Supervisor applies a change to this file to an installed App only
# when the version changes: a rebuild keeps the configuration it installed
# with (supervisor/apps/app.py:1199 at 98a2322). Raise the version with
# every change to ingress, ports, options or permissions.
name: ha-airlock
version: "0.7.1-dev"
slug: ha_airlock
description: MCP gateway for Home Assistant with client approval, redaction and an audit log. Read-only diagnostic tools so far.
url: https://github.com/SukramJ/ha-airlock
arch:
  - aarch64
  - amd64

# hassio_api lets ha-airlock ask the Supervisor where Core listens; the
# default role covers that. homeassistant_api opens the Supervisor's proxy
# to Core, which is used once, to create ha-airlock's own user.
hassio_api: true
homeassistant_api: true

# The page in the sidebar on which an administrator approves, denies and
# revokes MCP clients. The Supervisor serves it to administrators only.
ingress: true
ingress_port: 8099
panel_title: ha-airlock
panel_icon: mdi:shield-lock-outline

# The App's own configuration folder, mounted at /config, read-only: the
# owner puts policy.json there, and ha-airlock cannot change its own
# policy. The Supervisor creates the folder when the App starts and
# includes it in backups (supervisor/docker/app.py:500-516,
# supervisor/apps/app.py:1408-1418 and :1642 at 98a2322).
map:
  - addon_config:ro

# The authorization server and the MCP endpoint. The port is not published
# after installation. Publish it only towards a reverse proxy that serves it
# over HTTPS, and enter that HTTPS address as public_url.
ports:
  8443/tcp: null
ports_description:
  8443/tcp: MCP and OAuth, plain HTTP, for your HTTPS reverse proxy only

# public_url: the HTTPS origin under which your reverse proxy serves port
# 8443, for example https://airlock.example.org. Without it there is no MCP
# access; the sidebar page works regardless.
options: {}
schema:
  public_url: url?
